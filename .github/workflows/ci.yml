name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install libmtp
        run: brew install libmtp

      - name: Build
        run: ./build.sh

      - name: Smoke test
        run: ./scripts/smoke-test.sh
