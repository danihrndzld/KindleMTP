name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install libmtp
        run: brew install libmtp

      - name: Build
        run: ./build.sh

      - name: Smoke test
        run: ./scripts/smoke-test.sh

      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent KindleMTP.app "KindleMTP-${GITHUB_REF_NAME}-macos-arm64.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "KindleMTP-${GITHUB_REF_NAME}-macos-arm64.zip" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
